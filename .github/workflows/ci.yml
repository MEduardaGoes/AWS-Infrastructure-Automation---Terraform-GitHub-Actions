name: Terraform S3 Security CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  guardrails:
    name: Security Guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history for secret scanning
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test repository guardrails
        run: python3 -m unittest discover -s tests -v

      - name: Reject tracked sensitive files and missing lock file
        run: python3 scripts/check_tracked_files.py

      - name: Scan Git history for secrets
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks-8.30.1.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact=100 --no-banner --log-opts="--all" .

      - name: Audit GitHub Actions security
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          version: 1.31.1
          inputs: .github/workflows
          online-audits: false
          advanced-security: false
          min-severity: low
          min-confidence: low

  terraform:
    name: Format, Validate and Mock Tests
    needs: guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b75000b53e9ce4de2b4712237bbdb711bdc92aba
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without remote backend
        run: terraform -chdir=terraform init -backend=false -lockfile=readonly -no-color

      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color

      - name: Test with mocked AWS provider
        run: terraform -chdir=terraform test -no-color

  security:
    name: S3 Security Baseline
    needs: guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@6f26dc90000b74feb589a906cdfae540f5119895
        with:
          config_file: .checkov.yml
          output_format: cli
          soft_fail: false

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [guardrails, terraform, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          GUARDRAILS_RESULT: ${{ needs.guardrails.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$GUARDRAILS_RESULT" "$TERRAFORM_RESULT" "$SECURITY_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "CI Gate failed: a required job failed, was cancelled, or was skipped."
              exit 1
            fi
          done
          echo "All required checks passed."
